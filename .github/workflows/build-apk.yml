name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Wumms-Lebenszaehler.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wumms-Lebenszaehler-APK
          path: Wumms-Lebenszaehler.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Wumms! Lebenszähler ${{ github.run_number }}
          body: Lade die Datei Wumms-Lebenszaehler.apk auf dein Android-Handy und installiere sie.
          files: Wumms-Lebenszaehler.apk
