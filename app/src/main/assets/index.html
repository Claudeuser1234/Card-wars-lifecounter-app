<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5DBDEB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wumms! Lebenszähler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235DBDEB'/%3E%3Cpath d='M50 82C20 62 12 46 22 32s24-8 28 4c4-12 18-18 28-4s2 30-28 50z' fill='%23E8241A' stroke='%232a0c0c' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700&family=Luckiest+Guy&family=Metamorphous&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2233;--paper:#FFF8E6;--med:'Metamorphous',Georgia,serif;--bang:'Bangers',Impact,'Arial Black',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:#7CCBF2;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-rows:1fr auto 1fr;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
.prow{display:grid;grid-template-columns:repeat(var(--n,1),1fr);gap:12px;min-height:0}

.player{position:relative;min-height:0;container-type:size}
.player.flip{transform:rotate(180deg)}
.card{position:absolute;inset:0 5px 5px 0;background:color-mix(in srgb,var(--c) 84%,transparent);
  border:3.5px solid var(--ink);border-radius:30px 40px 28px 44px / 40px 28px 44px 30px;
  box-shadow:5px 5px 0 rgba(29,26,47,.85);overflow:hidden;transition:background .3s}
.card::after{content:"";position:absolute;width:38%;height:22%;left:7%;top:9%;border-radius:50%;
  background:rgba(255,255,255,.3);transform:rotate(-14deg);pointer-events:none}

.cimg{position:absolute;pointer-events:none;display:none;object-fit:contain;left:50%;transform:translateX(-50%)}
.player.b-top .cimg{display:block;z-index:2;top:max(52px,13cqh);width:84%;height:22%;filter:drop-shadow(3px 3px 0 rgba(29,26,47,.3))}
.player.b-bg .cimg{display:block;z-index:0;top:50%;width:94%;height:60%;transform:translate(-50%,-50%) rotate(-4deg);opacity:.32}

.zones{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;z-index:1}
.zone{display:flex;align-items:center;padding:0 5%;touch-action:none}
.zone.plus{justify-content:flex-end}
.zone .btn{width:clamp(38px,17cqmin,84px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:#fff;border:3.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  font-family:'Luckiest Guy','Arial Black',sans-serif;font-size:clamp(24px,11cqmin,54px);line-height:1;padding-top:.12em;transition:transform .08s}
.zone.down .btn{transform:translate(2px,2px) scale(.94);box-shadow:1px 1px 0 var(--ink)}

.hp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2;
  font-family:var(--med);color:#E8241A;line-height:1;font-size:min(46cqmin,30cqh);transition:padding .2s;
  text-shadow:3px 0 0 #2a0c0c,-3px 0 0 #2a0c0c,0 3px 0 #2a0c0c,0 -3px 0 #2a0c0c,
   2px 2px 0 #2a0c0c,-2px -2px 0 #2a0c0c,2px -2px 0 #2a0c0c,-2px 2px 0 #2a0c0c,
   6px 6px 0 #8E0B0B,8px 8px 0 #2a0c0c}
.player.b-top .hp{padding-top:22cqh}
.hp.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.13) rotate(-3deg)}100%{transform:scale(1)}}
.hp.low{animation:blink 1s steps(2) infinite}@keyframes blink{50%{color:#FF8A3D}}

.top{position:absolute;left:0;right:0;top:10px;display:flex;justify-content:center;z-index:3;pointer-events:none}
.name{pointer-events:auto;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:#fff;border:3.5px solid var(--ink);border-radius:999px;padding:3px 14px;
  font-weight:700;font-size:18px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}

.foot{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;align-items:center;gap:8px;z-index:3;pointer-events:none;flex-wrap:wrap;padding:0 8px}
.pips{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.pip{width:36px;height:36px;border-radius:50%;border:3.5px solid var(--ink);background:#FFE14D;box-shadow:2px 2px 0 var(--ink);
  display:grid;place-items:center;font-size:17px;padding:0;transition:transform .1s}
.pip.used{background:#d9d4e8;color:#8a84a3;box-shadow:none;transform:translate(2px,2px)}
.lbl{font-family:var(--bang);font-size:17px;letter-spacing:1px;background:rgba(255,255,255,.7);border-radius:8px;padding:1px 6px}
@container (max-width:250px){
  .name{font-size:15px;padding:2px 10px}
  .lbl{display:none}
  .pip{width:28px;height:28px;font-size:13px;border-width:3px}
  .hp{text-shadow:2px 0 0 #2a0c0c,-2px 0 0 #2a0c0c,0 2px 0 #2a0c0c,0 -2px 0 #2a0c0c,4px 4px 0 #8E0B0B,5px 5px 0 #2a0c0c}
}

.burst{display:none!important;position:absolute;top:16%;right:4%;width:min(42%,170px);aspect-ratio:1;z-index:4;pointer-events:none;
  display:grid;place-items:center;opacity:0;transform:scale(.3) rotate(-20deg);transition:opacity .15s,transform .2s cubic-bezier(.3,1.8,.5,1)}
.burst.show{opacity:1;transform:scale(1) rotate(8deg)}
.burst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst .bt{position:relative;text-align:center;line-height:.9}
.burst .bw{display:block;font-family:var(--bang);font-size:clamp(15px,9cqmin,30px);letter-spacing:1px}
.burst .bd{display:block;font-family:'Luckiest Guy','Arial Black',sans-serif;font-size:clamp(20px,13cqmin,44px)}

.ko{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(29,26,47,.55)}
.player.dead .ko{display:flex}
.ko b{font-family:var(--med);font-weight:400;font-size:min(34cqmin,22cqh);color:#E8241A;transform:rotate(-8deg);
  text-shadow:3px 0 0 #2a0c0c,-3px 0 0 #2a0c0c,0 3px 0 #2a0c0c,0 -3px 0 #2a0c0c,6px 6px 0 #2a0c0c;animation:pop .4s}
.ko button{background:#FFE14D;border:3.5px solid var(--ink);border-radius:16px;padding:6px 16px;font-family:var(--bang);font-size:22px;letter-spacing:1px;box-shadow:3px 3px 0 var(--ink)}

.midwrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.banner{display:none;max-width:100%;max-height:11vh;object-fit:contain;filter:drop-shadow(3px 3px 0 rgba(29,26,47,.35))}
.banner.on{display:block}
.mid{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.mb{width:50px;height:50px;flex:none;border-radius:16px;border:3.5px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);
  font-size:24px;display:grid;place-items:center;padding:0}
.mb:active,.round:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mb svg{width:27px;height:27px}
.round{flex:1;min-width:0;text-align:center;font-family:var(--med);font-size:20px;color:#C8160F;background:#FFE14D;border:3.5px solid var(--ink);
  border-radius:18px 12px 20px 10px;box-shadow:3px 3px 0 var(--ink);padding:6px 4px;transform:rotate(-1deg);white-space:nowrap;line-height:1.1}
.round small{display:block;font-family:'Fredoka';font-size:11px;color:var(--ink);opacity:.7}

.modal{position:fixed;inset:0;z-index:20;background:rgba(29,26,47,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.sheet{width:min(100%,430px);max-height:88vh;overflow:auto;background:var(--paper);border:3.5px solid var(--ink);border-radius:26px 32px 24px 34px;
  box-shadow:6px 6px 0 var(--ink);padding:18px;animation:pop .25s}
.sheet h2{margin:0 0 12px;font-family:var(--med);font-size:28px;font-weight:400;color:#C8160F}
.sheet p{margin:0 0 14px;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;flex-wrap:wrap}
.row>span{font-weight:700}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-family:'Luckiest Guy','Arial Black',sans-serif;font-size:22px;box-shadow:2px 2px 0 var(--ink);padding-top:4px}
.step output{min-width:40px;text-align:center;font-family:var(--med);font-size:24px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);padding:0}
.sw button.on{outline:3px solid var(--ink);outline-offset:2px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.act{border:3.5px solid var(--ink);border-radius:14px;padding:8px 16px;font-family:var(--bang);font-size:22px;letter-spacing:1px;box-shadow:3px 3px 0 var(--ink);background:#fff}
.act.go{background:#8BE36B}.act.warn{background:#FF8FC0}
.file{display:inline-block;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;background:#fff;font-weight:700;box-shadow:2px 2px 0 var(--ink);position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0}
input[type=text]{width:100%;font:inherit;font-size:22px;font-weight:700;padding:10px 14px;border:3.5px solid var(--ink);border-radius:14px;background:#fff;outline:none}
.log{list-style:none;margin:0;padding:0;font-size:16px}
.log li{padding:7px 4px;border-bottom:2px dashed rgba(29,26,47,.25);display:flex;gap:8px}
.log li i{font-style:normal;font-family:var(--bang);letter-spacing:1px;opacity:.6;min-width:34px}
.log .neg{color:#d63a3a;font-weight:700}.log .pos{color:#2f9b2f;font-weight:700}
.coin{width:150px;height:150px;margin:6px auto 14px;border-radius:50%;background:#FFD93B;border:5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
  display:grid;place-items:center;font-family:var(--med);font-size:64px;color:#C8160F}
.coin.spin{animation:flip 1.1s cubic-bezier(.2,.7,.3,1)}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}40%{transform:rotateY(900deg) translateY(-40px)}100%{transform:rotateY(1800deg) translateY(0)}}
.center{text-align:center}
.hint{font-size:14px;opacity:.7;margin-top:10px}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5DBDEB"/><stop offset=".55" stop-color="#9ED8F3"/></linearGradient></defs>
 <rect width="400" height="900" fill="url(#sky)"/>
 <g fill="#fff" stroke="#2a2233" stroke-width="2">
  <path d="M30 90c-12 0-14-18 0-18 2-14 24-14 26-2 10-8 26 0 22 12 12 2 10 18-2 18z"/>
  <path d="M250 60c-10 0-12-15 0-15 3-12 20-12 22-2 9-7 22 0 19 10 10 2 8 15-2 15z"/>
  <path d="M300 180c-14 0-16-20 0-20 3-16 28-16 30-3 12-9 30 0 26 14 14 2 12 21-3 21z"/>
  <path d="M60 230c-9 0-10-13 0-13 2-10 17-10 18-2 8-6 18 0 16 9 9 1 8 14-2 14z"/>
  <path d="M150 820c-12 0-14-17 0-17 2-13 23-13 25-2 10-8 25 0 21 11 12 2 10 18-2 18z"/>
 </g>
 <g stroke="#2a2233" stroke-width="2" stroke-linejoin="round">
  <path d="M-10 470 40 360 80 430 125 330 175 440 215 370 260 450 305 340 350 420 410 350 410 500-10 500z" fill="#8DB5E6"/>
  <path d="M40 360 26 392 40 384 52 396 58 388zM125 330 108 368 124 358 136 372 146 360zM215 370 200 400 214 392 226 402 232 395zM305 340 288 378 304 368 318 382 326 372zM410 350 395 382 410 374z" fill="#fff"/>
  <path d="M-10 500c40-30 80-30 120-8 40-26 90-26 130 0 40-24 100-24 170 0v40H-10z" fill="#F4F8FF"/>
  <path d="M-10 560c60-50 140-50 200-10 60-40 150-40 220 0v360H-10z" fill="#86D05A"/>
  <path d="M-10 640c70-40 130-30 190 10 70-40 160-40 230-10v270H-10z" fill="#6CC145"/>
  <path d="M120 560c30 40-40 70-10 110s90 60 40 120-10 80 0 110" fill="none" stroke="#2a2233" stroke-width="20"/>
  <path d="M120 560c30 40-40 70-10 110s90 60 40 120-10 80 0 110" fill="none" stroke="#5AB4EC" stroke-width="15"/>
  <path d="M330 520l-14 34h28zM355 530l-12 30h24zM40 590l-14 34h28z" fill="#3E9A3A"/>
 </g>
 <g fill="none" stroke="#2a2233" stroke-width="2" stroke-linecap="round">
  <path d="M250 700l4-8 4 8M300 760l4-8 4 8M60 780l4-8 4 8M210 860l4-8 4 8M340 840l4-8 4 8"/>
 </g>
</svg>
<div id="app">
  <div class="prow" id="rowTop"></div>
  <div class="midwrap"><img class="banner" id="banner" alt="">
  <nav class="mid">
    <button class="mb" id="bReset" aria-label="Neues Spiel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="mb" id="bCoin" aria-label="Wer beginnt?">🪙</button>
    <button class="round" id="round">RUNDE 1</button>
    <button class="mb" id="bLog" aria-label="Verlauf">📜</button>
    <button class="mb" id="bSet" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </nav></div>
  <div class="prow" id="rowBot"></div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
const COLORS=['#62D2F5','#FF8FC0','#8BE36B','#FFA94D','#FFD93B','#B79CFF'];
const HIT=['POW!','BAM!','ZACK!','KLONK!','WUMMS!','AUTSCH!'];
const HEAL=['JUHU!','HEIL!','YEAH!','LECKER!'];
const KEY='wumms-lifecounter-v2',BKEY='wumms-banner';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mkPlayer=(i,hp)=>({name:'Spieler '+(i+1),hp,color:COLORS[i%COLORS.length],used:0});

function fresh(prev){
  const startHp=prev?prev.startHp:25,apt=prev?prev.apt:2,n=prev?prev.players.length:2;
  const players=[];for(let i=0;i<n;i++){const o=prev&&prev.players[i];players.push({name:o?o.name:'Spieler '+(i+1),color:o?o.color:COLORS[i],hp:startHp,used:0})}
  return {startHp,apt,round:1,players,log:[]};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.players)||S.players.length<2)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- layout ---------- */
// which player indices go top (rotated) / bottom
const LAYOUT={2:[[1],[0]],3:[[1],[0,2]],4:[[2,1],[0,3]]};
function starPoints(n,ro,ri){let p=[];for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=Math.PI*i/n-Math.PI/2;p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
const STAR=starPoints(12,50,36);
let panels=[],pend=[];
function build(){
  [0,1].forEach(()=>{});
  Object.values(pend).forEach(P=>clearTimeout(P&&P.timer));
  const [top,bot]=LAYOUT[S.players.length];
  const rt=$('#rowTop'),rb=$('#rowBot');rt.innerHTML='';rb.innerHTML='';
  rt.style.setProperty('--n',top.length);rb.style.setProperty('--n',bot.length);
  panels=[];pend=S.players.map(()=>({}));
  const mk=(i,flip)=>{
    const el=document.createElement('section');el.className='player'+(flip?' flip':'');
    el.innerHTML=`<div class="card">
      <img class="cimg" alt="">
      <div class="zones"><div class="zone minus"><span class="btn">−</span></div><div class="zone plus"><span class="btn">+</span></div></div>
      <div class="hp"></div>
      <div class="top"><button class="name"></button></div>
      <div class="burst"><svg viewBox="0 0 100 100"><polygon points="${STAR}" fill="#fff" stroke="#2a2233" stroke-width="4" stroke-linejoin="round"/></svg><div class="bt"><span class="bw"></span><span class="bd"></span></div></div>
      <div class="foot"><span class="lbl">AKTIONEN</span><div class="pips"></div></div>
      <div class="ko"><b>K.O.!</b><button class="again">NOCHMAL!</button></div></div>`;
    el.querySelector('.name').onclick=()=>editName(i);
    el.querySelector('.again').onclick=()=>askNew();
    bindHold(el.querySelector('.zone.minus'),i,-1);bindHold(el.querySelector('.zone.plus'),i,1);
    panels[i]=el;return el;
  };
  top.forEach(i=>rt.appendChild(mk(i,true)));
  bot.forEach(i=>rb.appendChild(mk(i,false)));
  render();applyBanner();
}

/* ---------- tap & hold ---------- */
function bindHold(z,p,d){
  let t1,t2;const stop=()=>{clearTimeout(t1);clearInterval(t2);z.classList.remove('down')};
  z.addEventListener('pointerdown',e=>{e.preventDefault();wake();z.classList.add('down');change(p,d);
    t1=setTimeout(()=>{t2=setInterval(()=>change(p,d),140)},450)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>z.addEventListener(ev,stop));
  z.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ---------- life ---------- */
function change(p,d){
  const pl=S.players[p],nv=Math.max(0,Math.min(99,pl.hp+d));if(nv===pl.hp)return;
  const P=pend[p];if(P.sum===undefined){P.sum=0;P.from=pl.hp;P.word=null}
  P.sum+=d;pl.hp=nv;
  const neg=P.sum<0;if(!P.word||neg!==P.neg){const L=neg?HIT:HEAL;P.word=L[Math.random()*L.length|0];P.neg=neg}
  try{navigator.vibrate&&navigator.vibrate(d<0?14:8)}catch(e){}
  showBurst(p);renderPlayer(p,true);save();
  clearTimeout(P.timer);P.timer=setTimeout(()=>commit(p),1600);
}
function commit(p){
  const P=pend[p],pl=S.players[p];if(!P||!pl)return;
  if(P.sum){S.log.unshift({r:S.round,n:pl.name,from:P.from,to:pl.hp,d:P.sum});S.log=S.log.slice(0,200);save()}
  pend[p]={};if(panels[p])panels[p].querySelector('.burst').classList.remove('show');
}
const flushAll=()=>pend.forEach((P,p)=>{clearTimeout(P.timer);commit(p)});
function showBurst(p){
  const P=pend[p],b=panels[p].querySelector('.burst');
  if(!P.sum){b.classList.remove('show');return}
  b.querySelector('.bw').textContent=P.word;
  const bd=b.querySelector('.bd');bd.textContent=(P.sum>0?'+':'')+P.sum;bd.style.color=P.sum<0?'#E23B3B':'#2f9b2f';
  b.querySelector('polygon').setAttribute('fill',P.sum<0?'#FFE14D':'#C9F7B4');b.classList.add('show');
}

/* ---------- action points (free toggle) ---------- */
function setPip(p,i){const pl=S.players[p];pl.used=(i<pl.used)?i:i+1;save();renderPlayer(p)}

/* ---------- render ---------- */
function renderPlayer(p,bump){
  const el=panels[p],pl=S.players[p];if(!el)return;
  el.style.setProperty('--c',pl.color);
  const hp=el.querySelector('.hp');hp.textContent=pl.hp;hp.classList.toggle('low',pl.hp<=5&&pl.hp>0);
  if(bump){hp.classList.remove('pop');void hp.offsetWidth;hp.classList.add('pop')}
  el.querySelector('.name').textContent=pl.name;
  el.classList.toggle('dead',pl.hp<=0);
  const pips=el.querySelector('.pips');
  if(pips.children.length!==S.apt){pips.innerHTML='';for(let i=0;i<S.apt;i++){const b=document.createElement('button');b.className='pip';b.textContent='★';b.onclick=()=>setPip(p,i);pips.appendChild(b)}}
  [...pips.children].forEach((b,i)=>b.classList.toggle('used',i<pl.used));
  el.querySelector('.foot').style.display=S.apt?'':'none';
}
function render(){S.players.forEach((_,p)=>renderPlayer(p));$('#round').innerHTML='RUNDE '+S.round+'<small>tippen = nächste Runde</small>'}

/* ---------- next round: refill all action points ---------- */
$('#round').onclick=()=>{flushAll();S.round++;S.players.forEach(p=>p.used=0);S.log.unshift({r:S.round,t:'Neue Runde – Aktionen aufgefüllt'});save();render()};

/* ---------- banner / logo image ---------- */
let BMODE='top',BSRC=null;try{BMODE=localStorage.getItem(BKEY+'-mode')||'top';BSRC=localStorage.getItem(BKEY)}catch(e){}
function applyBanner(){
  const b=$('#banner');
  if(BSRC&&BMODE==='mid'){b.src=BSRC;b.classList.add('on')}else{b.removeAttribute('src');b.classList.remove('on')}
  panels.forEach(el=>{if(!el)return;const im=el.querySelector('.cimg');
    el.classList.toggle('b-top',!!BSRC&&BMODE==='top');el.classList.toggle('b-bg',!!BSRC&&BMODE==='bg');
    if(BSRC&&BMODE!=='mid')im.src=BSRC;else im.removeAttribute('src')});
}
function setMode(m){BMODE=m;try{localStorage.setItem(BKEY+'-mode',m)}catch(e){}applyBanner()}
function loadBanner(file){
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const k=Math.min(1,900/img.width),c=document.createElement('canvas');c.width=img.width*k|0;c.height=img.height*k|0;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);BSRC=c.toDataURL('image/png');
    try{localStorage.setItem(BKEY,BSRC)}catch(e){}applyBanner()};img.src=r.result};r.readAsDataURL(file);
}

/* ---------- dialogs ---------- */
const modal=$('#modal'),sheet=$('#sheet');
const open=h=>{sheet.innerHTML=h;modal.classList.add('open')},close=()=>modal.classList.remove('open');
modal.addEventListener('pointerdown',e=>{if(e.target===modal)close()});

function editName(p){
  open(`<h2>Wie heisst du?</h2><input type="text" id="nm" maxlength="18" value="${esc(S.players[p].name)}">
  <div class="acts"><button class="act" id="x">ABBRECHEN</button><button class="act go" id="ok">PASST!</button></div>`);
  const inp=$('#nm');setTimeout(()=>{inp.focus();inp.select()},50);
  const ok=()=>{S.players[p].name=inp.value.trim()||('Spieler '+(p+1));save();render();close()};
  $('#ok').onclick=ok;$('#x').onclick=close;inp.onkeydown=e=>{if(e.key==='Enter')ok()};
}
function newGame(){flushAll();S=fresh(S);save();build();close()}
function askNew(){
  open(`<h2>Neues Spiel?</h2><p>Alle starten wieder mit <b>${S.startHp}</b> Leben. Namen und Farben bleiben.</p>
  <div class="acts"><button class="act" id="x">NEE</button><button class="act warn" id="ok">LOS GEHT'S!</button></div>`);
  $('#ok').onclick=newGame;$('#x').onclick=close;
}
$('#bReset').onclick=askNew;

$('#bCoin').onclick=()=>{
  const n=S.players.length;
  open(`<h2 class="center">Wer beginnt?</h2><div class="coin spin" id="coin">?</div><p class="center" id="cr">&nbsp;</p>
  <div class="acts" style="justify-content:center"><button class="act go" id="x">OK</button></div>`);
  $('#x').onclick=close;
  const w=Math.random()*n|0;
  setTimeout(()=>{$('#coin').textContent=w+1;$('#cr').innerHTML=`<b>${esc(S.players[w].name)}</b> beginnt!`;
    S.log.unshift({r:S.round,n:S.players[w].name,t:'beginnt (Münzwurf)'});save()},1100);
};

$('#bLog').onclick=()=>{
  flushAll();
  const items=S.log.length?S.log.map(l=>l.d===undefined?`<li><i>R${l.r}</i><span>${l.n?'<b>'+esc(l.n)+'</b> ':''}${esc(l.t)}</span></li>`:
    `<li><i>R${l.r}</i><span><b>${esc(l.n)}</b>: ${l.from} → ${l.to} <span class="${l.d<0?'neg':'pos'}">(${l.d>0?'+':''}${l.d})</span></span></li>`).join(''):'<li>Noch nichts passiert…</li>';
  open(`<h2>Verlauf</h2><ul class="log">${items}</ul><div class="acts"><button class="act go" id="x">OK</button></div>`);
  $('#x').onclick=close;
};

$('#bSet').onclick=()=>{
  let hp=S.startHp,apt=S.apt,n=S.players.length;
  const cols=[0,1,2,3].map(i=>S.players[i]?S.players[i].color:COLORS[i]);
  const names=[0,1,2,3].map(i=>S.players[i]?S.players[i].name:'Spieler '+(i+1));
  const swRows=()=>[...Array(n)].map((_,i)=>`<div class="row"><span>${esc(names[i])}</span><div class="sw">${COLORS.map(c=>`<button data-i="${i}" data-c="${c}" style="background:${c}" class="${cols[i]===c?'on':''}"></button>`).join('')}</div></div>`).join('');
  open(`<h2>Einstellungen</h2>
    <div class="row"><span>Spieler</span><div class="step"><button data-k="n" data-d="-1">−</button><output id="on">${n}</output><button data-k="n" data-d="1">+</button></div></div>
    <div class="row"><span>Start-Leben</span><div class="step"><button data-k="hp" data-d="-1">−</button><output id="ohp">${hp}</output><button data-k="hp" data-d="1">+</button></div></div>
    <div class="row"><span>Aktionspunkte</span><div class="step"><button data-k="apt" data-d="-1">−</button><output id="oapt">${apt}</output><button data-k="apt" data-d="1">+</button></div></div>
    <div id="swr">${swRows()}</div>
    <div class="row"><span>Bild / Logo</span><div style="display:flex;gap:6px"><label class="file">Bild wählen<input type="file" accept="image/*" id="bfile"></label><button class="file" id="bdel">✕</button></div></div>
    <div class="row"><span>Bild-Position</span><div style="display:flex;gap:6px;flex-wrap:wrap" id="bmode">
      <button class="file" data-m="top">Über Leben</button><button class="file" data-m="bg">Hintergrund</button><button class="file" data-m="mid">Mitte</button></div></div>
    <p class="hint">Tippen = ±1 · Gedrückt halten = schnell zählen. Neue Start-Leben gelten ab dem nächsten Spiel; neue Spieler starten sofort mit den Start-Leben.</p>
    <div class="acts"><button class="act" id="x">ABBRECHEN</button><button class="act go" id="ok">SPEICHERN</button></div>`);
  const bindSw=()=>sheet.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{cols[+b.dataset.i]=b.dataset.c;
    b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  bindSw();
  sheet.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{
    const d=+b.dataset.d,k=b.dataset.k;
    if(k==='hp'){hp=Math.max(1,Math.min(99,hp+d));$('#ohp').textContent=hp}
    else if(k==='apt'){apt=Math.max(0,Math.min(6,apt+d));$('#oapt').textContent=apt}
    else{n=Math.max(2,Math.min(4,n+d));$('#on').textContent=n;$('#swr').innerHTML=swRows();bindSw()}
  });
  const mk=()=>sheet.querySelectorAll('#bmode button').forEach(b=>b.style.background=b.dataset.m===BMODE?'#FFE14D':'#fff');mk();
  sheet.querySelectorAll('#bmode button').forEach(b=>b.onclick=()=>{setMode(b.dataset.m);mk()});
  $('#bfile').onchange=e=>{const f=e.target.files[0];if(f)loadBanner(f)};
  $('#bdel').onclick=()=>{BSRC=null;try{localStorage.removeItem(BKEY)}catch(e){}applyBanner()};
  $('#x').onclick=close;
  $('#ok').onclick=()=>{
    flushAll();
    S.startHp=hp;S.apt=apt;
    while(S.players.length<n)S.players.push(mkPlayer(S.players.length,hp));
    while(S.players.length>n)S.players.pop();
    S.players.forEach((p,i)=>{p.color=cols[i];p.used=Math.min(p.used,apt)});
    save();build();close();
  };
};

/* ---------- keep screen on where allowed ---------- */
let lock=null;
async function wake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>lock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock=null});

build();
})();
</script>
</body>
</html>
